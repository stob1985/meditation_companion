# ---- BTC signal engine config -------------------------------------------
data:
  symbol: BTCUSDT
  interval: "D"          # D daily, "60"=1h, "120"=2h (matches the 2 screenshots)
  limit: 1000
  source: synthetic      # synthetic | live | csv
  exchange: auto         # auto | okx | hyperliquid | binanceus | coinbase | kraken | bybit
  csv_path: tests/sample_data.csv

events:
  pivot_lookback: 10     # image: pivLB=10
  rsi_len: 14
  rsi_os: 28             # ref dashboard (auto-opt): RSI OS (28)
  vol_lookback: 20
  vol_mult: 1.8
  streak_max: 3          # ref dashboard: Dn Streak(3)
  full_moon_pct: 96      # illumination % to call it a full moon

astro:
  enabled: true          # Phase 2 planetary aspects (astrology - see README caveat)
  orb: 6.0               # image: Orb Standard (6 deg)

vdb:
  cap: 500               # image: cap 500 samples/event
  horizons: [1, 3, 5]

signal:
  horizon: 3             # which horizon drives the composite lean
  forecast_conf: 0.68    # image: FORECAST 5-day @ 68%
  band_lookback: 180
  planet_weight: 0.0     # astro has NO proven edge; backtest improves with 0 (display-only)
  dwell_weight: 1.5      # weight of the dwell direction rule (transcript's main edge)
  flow_weight: 1.0       # weight of the money-flow / CVD lean
  regime_weight: 2.5     # weight of the trend/regime lean - keeps the composite with
                         # the trend (ref dashboard applies this as '0up/6down after regime')
  reversal_weight: 1.5   # sweep-reclaim weight (backtest-neutral -> kept moderate, not dominant)
  base_weights:
    "Saturday + TOM": 1.0
    "Pivot": 1.0
    "RSI OS (36)": 1.5
    "Vol Spike": 1.0
    "No Streak": 1.0
    "Full Moon": 0.9
    "ASIA / Late Asia": 0.8
    "Planets P2": 1.2

liquidity:
  swing_lookback: 5      # image: Piv 5
  history_bars: 200
  zone_mult: 0.3         # image: Zones ATRx0.3
  cvd_bars: 30
  # tiered maintenance margin (spot terms): higher leverage liquidates earlier
  mmr_tiers: {10: 0.004, 25: 0.005, 50: 0.0075, 100: 0.01}
  # multi-exchange liquidation aggregation (live only): cross-venue confluence
  multi_venue: true
  venues: [okx, binanceus, hyperliquid, kraken, coinbase]

# ---- trading layer: direction + liquidity -> entry/stop/target -----------
trade:
  enabled: true
  entry_mode: levels     # levels = wait for price at a structure level (validated,
                         #   partial TP) ; market = old enter-at-close plan
  conv_min: 62           # min composite conviction % to arm a level entry
  reach_atr: 2.0         # only arm if the entry level is within this many ATR
  rr_min: 3.0            # (market mode) minimum reward:risk (1:3)
  target_mode: rr        # (market mode) rr = nearest magnet >= rr_min ; nearest
  regime_filter: false   # (market mode) don't take trades that fight a STRONG regime
  bet_usd: 100           # FIXED collateral / margin per trade (USD)
  leverage: 10           # safer default (25x repeatedly flagged UNSAFE on wide stops)
  leverage_tiers: [10, 25, 50, 100]
  mmr: 0.005             # fallback maintenance-margin rate
  mmr_tiers: {10: 0.004, 25: 0.005, 50: 0.0075, 100: 0.01}   # tiered (per transcript)
  stop_buffer_atr: 0.25  # push stop this far BEYOND the structure (in ATR)
  stop_fallback_atr: 1.5 # stop distance when no structure is found
  taker_fee: 0.0005      # per-side taker fee (0.05%) for net P/L + backtest
  funding_daily: 0.0003  # est. daily funding cost on notional
  void_atr: 2.0          # no-trade if no structure within this many ATR
  enable_hedge: true     # in a range/equilibrium, return both long & short legs
  hedge_max_ratio: 6.0   # max net-directional size split between the two legs (e.g. 6:1)

# ---- dwell time / dwell block (time/volume-at-price) ---------------------
dwell:
  enabled: true
  lookback: 200          # bars used to build the profile
  bins: 60               # price buckets
  value_area_pct: 0.70   # share of dwell that defines the value area
  block_pctile: 75       # dwell percentile to qualify as a "dwell block"
  current_tol_atr: 0.5   # band (in ATR) for the current-dwell / coiling gauge

# ---- confluence overlays (context; not backtested composite inputs) -------
# ---- sweep-reclaim reversal (video: 'liquidity sweep of the lows -> reversal') --
reversal:
  swing_lookback: 10     # window for the prior swing low/high that gets swept
  confirm_bars: 3        # look this many recent bars for the sweep+reclaim
  rsi_os: 38             # oversold gate for a bullish reclaim
  rsi_ob: 62             # overbought gate for a bearish reject

macro:
  enabled: true          # best-effort: BTC vs SPX/NDX/DXY/gold/oil (Stooq)
sessions:
  enabled: true          # Asia/London/NY sequence stats (needs intraday data)
realflow:
  enabled: true          # LIVE real data: OKX liquidations + OI + long/short ratio
  inst_family: BTC-USDT  #   + Hyperliquid funding. Contrarian crowd read.
  liq_limit: 100

# ---- trap watch: liquidity-gravity + bull/bear-trap detection --------------
trap:
  enabled: true
  ls_hot: 1.6            # crowd L/S ratio that marks a crowded side
  funding_hot: 2.0e-5    # funding level that marks an overheated side
  zone_reach_atr: 6.0    # how far (ATR) the bait zone may sit from price

# ---- SWING layer: the "1-3 big trades per month" mode ---------------------
# ADDITIVE selection+management layer on top of the daily engine; the scalp
# trade plan above is untouched. See engine/swing.py.
volregime:
  enabled: true
  atr_len: 14
  bb_len: 20
  pctile_lookback: 365   # 1y window for the ATR%/BB-width percentile ranks
  squeeze_pctile: 25     # both gauges below this -> COMPRESSED (coiled energy)
  expand_pctile: 75      # both above this -> EXPANDED (move is mature)
  recent_bars: 10        # a squeeze within this many bars still counts (breakout bar)

etfflow:
  enabled: true          # US spot-ETF daily net flow (farside.co.uk, best-effort)

swing:
  enabled: true
  conv_min: 65           # RAISED composite bar (scalp uses 62) - few, big trades.
                         # Sweep: 65 beat 62 and 70 across all 3 walk-forward windows.
  min_gate_ratio: 0.66   # of the AVAILABLE gates this share must agree
  reach_atr: 3.0         # pullback entry level may sit this far (ATR)
  stop_buffer_atr: 0.5   # wider buffer beyond the Donchian structure
  stop_max_atr: 2.5      # risk cap: stop never further than this many ATR
  donchian_bars: 10      # runner trail = Donchian(10). Sweep result: 10 is the
                         # robust winner; 20/30 gave back the whole move.
  rr_big_min: 0.0        # 0 = info only. As a HARD gate it starved the system
                         # (wide swing stop makes 1.5R+ magnets near-impossible).
  tp1_min_r: 1.5         # TP1 at least this many R away (skip too-close clusters)
  tp1_frac: 0.33         # take only a THIRD at TP1 (scalp takes half)
  long_only: false       # shorts in BEAR regime EARNED their place in the sweep
  bet_usd: 100
  leverage: 5            # wide swing stops -> low leverage by design
  max_hold_bars: 60      # give the monthly move room (backtest cap)
  horizon: 21            # forecast band horizon (trading days ~ 1 month)
